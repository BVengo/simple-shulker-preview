plugins {
    id 'dev.bvengo.modkit.target'
}

// Preserve the existing archive names and Maven artifact ID.
modkit.archiveName = 'simpleshulkerpreview'

publishing.publications.named('mavenJava') {
    artifactId = 'simpleshulkerpreview'
}

// Retain the existing dependency scopes and exclusions from the shared declarations.
def clientDependencies = configurations.clientImplementation.dependencies
def integrations = clientDependencies.findAll {
    (it.group == 'com.terraformersmc' && it.name == 'modmenu') ||
        (it.group == 'dev.isxander' && it.name == 'yet-another-config-lib')
}

integrations.each { dependency ->
    clientDependencies.remove(dependency)
    dependencies.add('implementation', dependency)
}
