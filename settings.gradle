pluginManagement {
    providers.gradleProperty('modkit.includeBuild').orNull?.with { path ->
        includeBuild(path)
    }
    repositories {
        providers.gradleProperty('modkit.repository').orNull?.with { path ->
            maven { url = uri(path) }
        }
        maven { url = uri('https://maven.kikugie.dev/releases') }
        maven { url = uri('https://maven.fabricmc.net/') }
        maven { url = uri('https://maven.neoforged.net/releases/') }
        mavenCentral()
        gradlePluginPortal()
    }
}

plugins {
    id 'dev.bvengo.modkit.settings' version '0.1.0'
}

rootProject.name = 'simple-shulker-preview'
